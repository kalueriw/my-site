<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <title>Learning HTML — app icon</title>
  <!-- Full-bleed cream square: the phone or store rounds the corners itself,
       so the file must not carry its own transparent corners. The page mark
       is the same one as favicon.svg, enlarged with room to breathe. -->
  <rect width="180" height="180" fill="#FBF7F0"/>
  <rect x="40" y="34" width="100" height="112" rx="14" fill="#FFFFFF" stroke="#DCD6C9" stroke-width="4"/>
  <rect x="40" y="34" width="18" height="112" rx="8" fill="#B4441F"/>
  <rect x="76" y="60" width="46" height="9" rx="4.5" fill="#1C1917"/>
  <rect x="76" y="84" width="46" height="7" rx="3.5" fill="#8A8580"/>
  <rect x="76" y="102" width="28" height="7" rx="3.5" fill="#8A8580"/>
</svg>
